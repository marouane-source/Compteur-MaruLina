<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marouane &amp; Lina 💗</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Nunito:wght@400;600;800&display=swap">
<style>
:root{--bg:#ffe3ee;--bg2:#ffc6dc;--ink:#5a1f3d;--pink:#ff5c9a;--deep:#c2185b;--card:#fff8fb;--glow:rgba(255,92,154,.35)}
@media (prefers-color-scheme:dark){:root{--bg:#3a1229;--bg2:#5a1f3d;--ink:#ffe3ee;--card:#4a1834}}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:linear-gradient(160deg,var(--bg),var(--bg2)) fixed;color:var(--ink);font:17px/1.6 Nunito,system-ui,sans-serif;padding:max(28px,env(safe-area-inset-top,0px)) 20px max(28px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;overflow-x:hidden}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.15}
h1{font-size:clamp(2.2rem,9vw,3.6rem)}h2{font-size:1.5rem}
main{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:18px;width:100%}
#bg{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
#bg span{position:absolute;top:-8vh;animation:fall linear infinite;opacity:.5}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
.duo{display:flex;gap:14px;justify-content:center}
.duo img{width:min(40vw,190px);height:min(52vw,250px);object-fit:cover;border:6px solid #fff;border-bottom-width:20px;border-radius:6px;box-shadow:0 10px 28px var(--glow)}
.duo img:first-child{transform:rotate(-4deg)}.duo img:last-child{transform:rotate(4deg)}
.clock{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:420px}
.clock div{background:var(--card);border-radius:16px;padding:12px 4px;box-shadow:0 6px 18px var(--glow)}
.clock b{display:block;font:600 2rem/1 Fraunces,serif;color:var(--deep);font-variant-numeric:tabular-nums}
.clock small{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.love{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:420px}
.love button{border:0;background:var(--card);color:var(--ink);border-radius:16px;padding:12px 4px;font:800 .9rem Nunito,sans-serif;cursor:pointer;box-shadow:0 6px 18px var(--glow);transition:transform .2s}
.love button span{display:block;font-size:1.9rem}.love button:active{transform:scale(.92)}
.btn{border:0;background:var(--pink);color:#fff;font:800 1.05rem Nunito,sans-serif;padding:14px 30px;border-radius:999px;cursor:pointer;box-shadow:0 8px 24px var(--glow);text-decoration:none}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--deep);outline-offset:2px}
textarea{width:100%;max-width:420px;border:2px solid var(--bg2);border-radius:16px;padding:12px;font:inherit;background:var(--card);color:var(--ink);resize:none}
.wall{width:100%;max-width:420px;text-align:left;display:flex;flex-direction:column;gap:8px}
.wall p{background:var(--card);border-radius:14px;padding:10px 14px;box-shadow:0 4px 12px var(--glow)}
.wall small{display:block;opacity:.6;font-size:.72rem}
#wa{display:none}
.burst{position:fixed;pointer-events:none;font-size:1.8rem;z-index:9;animation:up 1.6s ease-out forwards}
@keyframes up{to{transform:translate(var(--x),-60vh) scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

if(m<0){y--;m+=12}
if(y<0)y=m=d=0;
[['cy',y],['cm',m],['cd',d],['ch',n.getHours()],['cn',n.getMinutes()],['cs',n.getSeconds()]].forEach(([i,v])=>$('#'+i).textContent=v);
const left=Math.ceil((new Date(2027,1,28)-n)/864e5);
$('#left').textContent=left>0?left+' days until our first anniversary 🌸':'Happy anniversary, my love 🌸'}
tick();setInterval(tick,1000);
let S={kiss:0,hug:0,heart:0,notes:[]};
try{const r=localStorage.getItem('lina_love');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('lina_love',JSON.stringify(S))}catch(e){}};
function draw(){$('#ck').textContent=S.kiss;$('#chg').textContent=S.hug;$('#cht').textContent=S.heart;
const w=$('#wall');w.textContent='';S.notes.slice(-5).reverse().forEach(n=>{const p=document.createElement('p');p.textContent=n.t;
const sm=document.createElement('small');sm.textContent=new Date(n.d).toLocaleDateString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});p.appendChild(sm);w.appendChild(p)})}
function wa(t){const a=$('#wa');a.href='https://wa.me/?text='+encodeURIComponent(t);a.style.display='inline-block'}
const msg={kiss:'Sending you a big kiss 💋',hug:'Sending you the warmest hug 🤗',heart:'Sending you my whole heart 💗'};
document.querySelectorAll('.love button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;S[k]++;save();draw();
const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top,12);wa(msg[k])});
$('#send').onclick=e=>{const v=$('#note').value.trim();if(!v)return;S.notes.push({t:v,d:Date.now()});save();draw();$('#note').value='';
const r=e.target.getBoundingClientRect();burst(r.left+r.width/2,r.top,16);wa('💌 '+v)};
draw();
</script>
</body>
</html>
